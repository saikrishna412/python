name: Deploy to GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: 'project-4687360f-210a-4542-96b'
          workload_identity_provider: 'projects/922219755972/locations/global/workloadIdentityPools/github-pool1/providers/github-provider'
          service_account: '922219755972-compute@developer.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP Authentication and Storage Access
        run: |
          gcloud auth list
          gcloud storage ls
